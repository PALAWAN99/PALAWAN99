name: Production CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint and Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          AUTH_SECRET: "test-secret-at-least-32-chars-long-12345"
          NEXTAUTH_URL: "http://localhost:3000"
          QR_SECRET: "test-qr-secret-at-least-32-chars-long-security-fix"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/qrcode-accesscontrol-frontend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/qrcode-accesscontrol-frontend:latest
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/smart-access
            DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build?schema=public

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/qrcode-accesscontrol-backend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/qrcode-accesscontrol-backend:latest

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Deploy Configuration to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ${{ secrets.DEPLOY_PATH }}/deploy"
          scp -r deploy/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy/

      - name: Pull and Start Containers on Remote Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} && \
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u ${{ env.GHCR_OWNER }} --password-stdin && \
            export IMAGE_TAG=${{ github.sha }} && \
            export GHCR_REPO_OWNER=${{ env.GHCR_OWNER }} && \
            if [ -f .env ]; then set -a; source .env; set +a; fi && \
            PROFILES='' && \
            if [ \"\${CARD_API_ON_SERVER:-true}\" = 'true' ]; then PROFILES='--profile card-api-server'; fi && \
            docker compose -f deploy/docker-compose.prod.yml \$PROFILES pull && \
            docker compose -f deploy/docker-compose.prod.yml \$PROFILES up -d --no-build
          "

      - name: Perform Post-Deployment Health Check
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} && \
            if [ -f .env ]; then set -a; source .env; set +a; fi && \
            PORT=\${FRONTEND_HOST_PORT:-13010} && \
            echo 'Performing health check on port \$PORT...' && \
            for i in {1..10}; do
              if curl -fsS \"http://127.0.0.1:\$PORT/smart-access/api/health\" >/dev/null; then
                echo '✅ Health check passed successfully!'
                exit 0
              fi
              echo 'Waiting for service to be healthy... (\$i/10)'
              sleep 5
            done
            echo '❌ Health check failed!'
            exit 1
          "

      - name: Rollback to Last Successful Deploy on Failure
        if: failure()
        run: |
          echo '🚨 Deployment or Health Check failed! Initiating rollback to last successful tag (latest)...'
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ${{ secrets.DEPLOY_PATH }} && \
            if [ -f .env ]; then set -a; source .env; set +a; fi && \
            export IMAGE_TAG=latest && \
            export GHCR_REPO_OWNER=${{ env.GHCR_OWNER }} && \
            PROFILES='' && \
            if [ \"\${CARD_API_ON_SERVER:-true}\" = 'true' ]; then PROFILES='--profile card-api-server'; fi && \
            docker compose -f deploy/docker-compose.prod.yml \$PROFILES up -d --no-build
          "
