# Snippet for lib.kku.ac.th — replace <FRONTEND_HOST_PORT> after pick-host-port.sh
# Mount: /home/admin/lib/nginx/default.conf → lib-nginx-1, then: nginx -t && nginx -s reload
#
# Use host IP (not 127.0.0.1): smart-access binds 0.0.0.0:<PORT> so other containers can connect.

# Next.js hashed assets — avoid WAF false positives on turbopack chunk names (~) and skip extra auth hops
location ^~ /smart-access/_next/static/ {
    proxy_pass http://10.101.118.149:<FRONTEND_HOST_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /smart-access {
    proxy_pass http://10.101.118.149:<FRONTEND_HOST_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}

# Required when CARD_API_ON_SERVER=true (USB reader on this host):
location ^~ /smart-access/card-api/ {
    proxy_pass http://10.101.118.149:<BACKEND_HOST_PORT>/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
}
