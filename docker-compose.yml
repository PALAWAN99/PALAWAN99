services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qrgat-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/qrgat_db?schema=public
      - AUTH_SECRET=${AUTH_SECRET:-yoursupersecretauthsecret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - QR_SECRET=${QR_SECRET:-qr-gate-secret-key-2024}
      - NODE_ENV=production
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qrgat-network

  db:
    image: postgres:16-alpine
    container_name: qrgat-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qrgat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qrgat-network

networks:
  qrgat-network:
    driver: bridge

volumes:
  postgres_data:
